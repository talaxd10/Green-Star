name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      PGADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://gs_owner:gs_owner@127.0.0.1:5432/green_star_test
      APP_DATABASE_URL: postgres://gs_app:gs_app@127.0.0.1:5432/green_star_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Create local roles
        run: psql "$PGADMIN_URL" -v ON_ERROR_STOP=1 -c "create role gs_owner login password 'gs_owner' createdb createrole" -c "create role gs_app login password 'gs_app'"
      - run: pnpm typecheck
      - name: Chromium, to draw statements
        run: pnpm --filter @green-star/api exec playwright-core install --with-deps chromium
      - run: pnpm test
